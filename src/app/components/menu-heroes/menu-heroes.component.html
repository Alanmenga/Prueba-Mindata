<div class="contenido-principal">
    <div>   
        <mat-form-field class="example-form-field">
            <mat-label>Buscar</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput type="text" [(ngModel)]="value" placeholder="Escribe aquí...">
          </mat-form-field>
          <button mat-button (click)="agregarHeroe()">Agregar Heroe</button>
    </div>

    <div>
        <mat-grid-list cols="3" rowHeight="1:1">
            <mat-grid-tile *ngFor="let heroe of paginatedHeroes()">
              <mat-card class="heroes-card" appearance="outlined">
                <mat-card-header>
                  <mat-card-title>{{ heroe.nombre }}</mat-card-title>
                </mat-card-header>
                <img mat-card-image src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="Imagen del héroe">
                <mat-card-content>
                  <p>{{ heroe.poder }}</p>
                </mat-card-content>
                <mat-card-actions>
                  <button mat-button (click)="editarHeroe(heroe.id)">Editar</button>
                  <button mat-button (click)="eliminarHeroe(heroe.id)">Eliminar</button>
                </mat-card-actions>
              </mat-card>
            </mat-grid-tile>
          </mat-grid-list>
          
          <!-- Paginador -->
          <mat-paginator #paginator [length]="heroesFiltrados().length" [pageSize]="3" [pageSizeOptions]="[3, 6, 9]" showFirstLastButtons></mat-paginator>          
    </div>
</div>
